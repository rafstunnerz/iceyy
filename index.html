<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXCLUSIVE</title>
<link rel="icon" href="https://i.ibb.co/vCwwgQ2D/TRAP-removebg-preview.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f2ff;--dim:rgba(245,242,255,.55);--gold:#d4af37;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;}
body{margin:0;min-height:100vh;overflow-x:hidden;overflow-y:scroll;color:var(--ink);background:#050505;font-family:Outfit,sans-serif;}
body::-webkit-scrollbar{display:none;}
.bgvideo{position:fixed;top:50%;left:50%;z-index:-3;min-width:100%;min-height:100%;transform:translate(-50%,-50%) scale(1.1);object-fit:cover;filter:brightness(.28) saturate(.8) contrast(1.1) blur(1px);}
.bgshade{position:fixed;inset:0;z-index:-2;background: radial-gradient(ellipse at center,rgba(0,0,0,.2) 0%, rgba(0,0,0,.7) 100%);}
#gate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:rgba(4,4,4,.85);backdrop-filter:blur(10px);}
.gatebox{text-align:center;animation:fadeIn 1s ease;}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
#gobtn{padding:16px 40px;color:#fff;border:2px solid #d4af37;border-radius:12px;background:rgba(212,175,55,.1);font-size:.8rem;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.3s;}
#gobtn:hover{background:#d4af37;color:#000;transform:scale(1.05);}
.wrap{width:100%;display:flex;flex-direction:column;align-items:center;padding:40px 20px;opacity:0;pointer-events:none;transition:opacity.5s ease;}
.wrap.show{opacity:1;pointer-events:auto;}
.tag{color:var(--dim);font-size:.68rem;letter-spacing:1.5px;text-align:center;}
.rule{width:60px;height:2px;margin:30px 0;background:var(--gold);}
#treeArea{width:min(1100px,calc(100% - 28px))}
.tier{display:flex;flex-direction:column;align-items:center;margin:60px 0;}
.ttitle{color:#fff;font-size:.68rem;letter-spacing:5px;margin-bottom:20px;}
.roster{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;}
.person{width:180px;min-height:240px;padding:15px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(5,5,7,.72);backdrop-filter:blur(10px);transition:.3s;}
.person:hover{border-color:var(--gold);transform:translateY(-8px);}
.pface{width:110px;height:110px;margin:0 auto;border-radius:50%;overflow:hidden;border:2px solid rgba(212,175,55,.3);}
.pface img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.pplacard{margin-top:10px;padding:10px;border:1px solid rgba(220,210,255,.14);border-radius:9px;background:rgba(255,255,255,.07);text-align:center;}
.pname{font-size:.8rem;font-weight:700;}
.phandle{font-size:.6rem;color:var(--dim);}
.pstatus{color:var(--gold);font-size:.6rem;margin-top:4px;}
.aboutme{width:min(500px,calc(100% - 40px));padding:20px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(5,5,7,.72);backdrop-filter:blur(10px);text-align:center;transition:.3s;}
.aboutme:hover{border-color:var(--gold);transform:translateY(-5px);}
.aboutme-title{font-size:.75rem;letter-spacing:3px;color:var(--gold);margin-bottom:12px;font-weight:700;}
.aboutme-text{font-size:.7rem;color:var(--dim);line-height:1.6;}
.player{width:min(600px,calc(100% - 40px));margin:60px auto;padding:25px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(5,5,7,.72);backdrop-filter:blur(10px);display:flex;gap:20px;align-items:center;}
.player-cover{width:90px;height:90px;border-radius:10px;overflow:hidden;border:2px solid var(--gold);}
.player-cover img{width:100%;height:100%;object-fit:cover;}
.player-info{flex:1;}
.player-title{font-size:1rem;font-weight:700;}
.player-artist{font-size:.75rem;color:var(--dim);margin-bottom:12px;}
.player-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--ink);width:40px;height:40px;border-radius:8px;cursor:pointer;transition:.2s;font-size:1rem;}
.player-btn:hover{background:var(--gold);color:#000;}
.navdots{position:fixed;right:30px;top:50%;transform:translateY(-50%);z-index:90;display:flex;flex-direction:column;gap:16px;}
.navdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s;}
.navdot.active{background:var(--gold);transform:scale(1.3);}
</style>
</head>
<body>

<img class="bgvideo" src="https://i.imgur.com/B5fWSD5.gif" alt="background"> <!-- BAGONG BG DITO -->
<div class="bgshade"></div>

<div class="navdots">
<div class="navdot active" data-target="exclusive"></div>
<div class="navdot" data-target="about"></div>
<div class="navdot" data-target="player"></div>
</div>

<div id="gate">
<div class="gatebox">
<button id="gobtn">die w me.</button>
</div>
</div>

<main class="wrap">
<p class="tag">“exclusive.”</p>
<div class="rule"></div>

<section id="treeArea">
<div class="tier" id="exclusive">
<div class="ttitle">EXCLUSIVE</div>
<div class="roster">
<article class="person">
<div class="pface"><img src="https://i.imgur.com/M1ftfV8.jpeg"></div>
<div class="pplacard"><div class="pname">SPINBACK/WAY2IC</div><div class="phandle">@icey.666</div><div class="pstatus">Online</div></div>
</article>
</div>
</div>

<div class="tier" id="about">
<div class="ttitle">ABOUT ME</div>
<div class="aboutme">
<div class="aboutme-title">above all gods</div>
<div class="aboutme-text">
ayoko sa bobo tol<br>
"exclusive"<br>
revshit
</div>
</div>
</div>

</section>

<div class="player" id="player">
<div class="player-cover"><img src="https://i.imgur.com/1I3xiWj.jpeg"></div>
<div class="player-info">
<div class="player-title">DIE FOR ME</div>
<div class="player-artist">CHASE ATLANTIC</div>
<button class="player-btn" id="playBtn">⏸</button>
</div>
</div>

</main>

<script>
var audio = new Audio();
audio.src = "./Chase Atlantic - DIE FOR ME (Official Lyric Video) (2).mp3";
audio.volume = 0.6;
audio.loop = true;
var isPlaying = true;

document.getElementById("gobtn").addEventListener("click",function(){
document.getElementById("gate").style.display="none";
document.querySelector(".wrap").classList.add("show");
audio.play().catch(()=>{});
document.getElementById("playBtn").innerHTML = "⏸";
});

document.getElementById("playBtn").addEventListener("click",function(){
if(isPlaying){ audio.pause(); this.innerHTML = "▶"; isPlaying = false;}
else{ audio.play().catch(()=>{}); this.innerHTML = "⏸"; isPlaying = true;}
});

// NAV DOTS
document.querySelectorAll('.navdot').forEach(dot=>{
dot.addEventListener('click',()=>{
document.getElementById(dot.dataset.target).scrollIntoView({behavior:'smooth'});
});
});
</script>
</body>
</html>
