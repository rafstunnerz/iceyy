<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>revshit</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#000;color:#fff;font-family:Outfit,sans-serif}

/* BG IMAGE + OVERLAY */
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;background:url('https://i.imgur.com/yDRpmBz.jpeg') center/cover no-repeat;filter:brightness(.4)}
.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.8))}

/* GLASS CONTAINER */
.wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:12px;padding:20px}
.banner{width:min(700px,90%);height:120px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);background:rgba(0,0,0,.3)}
.banner img{width:100%;height:100%;object-fit:cover}

.glass-card{width:min(700px,90%);padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:rgba(15,15,15,.4);backdrop-filter:blur(20px);display:flex;align-items:center;gap:12px}
.avatar{width:45px;height:45px;border-radius:50%;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.info.name{font-weight:700;font-size:.9rem}
.info.name span{background:rgba(0,255,255,.2);padding:2px 6px;border-radius:4px;font-size:.6rem;margin-left:5px}
.info.status{font-size:.75rem;color:rgba(255,255,255,.6)}

.player{width:min(700px,90%);padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:rgba(15,15,15,.4);backdrop-filter:blur(20px)}
.p-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.p-cover{width:45px;height:45px;border-radius:8px;overflow:hidden}
.p-cover img{width:100%;height:100%;object-fit:cover}
.p-info.title{font-weight:700;font-size:.9rem}
.p-info.artist{font-size:.75rem;color:rgba(255,255,255,.6)}
.explicit{margin-left:auto;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.2);font-size:.6rem}

.progress{width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:2px;cursor:pointer;margin:8px 0}
.bar{height:100%;width:6%;background:#fff;border-radius:2px}
.time{display:flex;justify-content:space-between;font-size:.7rem;color:rgba(255,255,255,.6)}

.views{position:fixed;bottom:30px;left:30px;padding:8px 14px;border-radius:20px;background:rgba(15,15,15,.4);backdrop-filter:blur(20px);font-size:.8rem;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="shade"></div>

<div class="wrap">
  <div class="banner">
    <img src="https://i.imgur.com/I4ah3By.jpeg" alt="banner">
  </div>

  <div class="glass-card">
    <div class="avatar"><img src="https://i.imgur.com/M1ftfV8.jpeg"></div>
    <div class="info">
      <div class="name">icey.666 <span>REV</span></div>
      <div class="status">blessed</div>
    </div>
  </div>

  <div class="player">
    <div class="p-top">
      <div class="p-cover"><img src="https://i.imgur.com/1I3xiWj.jpeg"></div>
      <div class="p-info">
        <div class="title">DIE FOR ME</div>
        <div class="artist">Chase Atlantic</div>
      </div>
      <div class="explicit">Explicit</div>
    </div>
    <div class="progress"><div class="bar"></div></div>
    <div class="time"><span>00:06</span><span>03:26</span></div>
  </div>
</div>

<div class="views">👁 7</div>
</body>
</html>
