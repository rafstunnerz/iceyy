<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOD'S FAVORITE</title>
<link rel="icon" href="https://i.ibb.co/vCwwgQ2D/TRAP-removebg-preview.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f2ff;--dim:rgba(245,242,255,.55);--gold:#d4af37;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;}
body{margin:0;min-height:100vh;overflow-x:hidden;overflow-y:scroll;color:var(--ink);background:#050505;font-family:Outfit,sans-serif;}
body::-webkit-scrollbar{display:none;}
.bgvideo{position:fixed;top:50%;left:50%;z-index:-3;min-width:100%;min-height:100%;transform:translate(-50%,-50%) scale(1.1);object-fit:cover;filter:brightness(.28) saturate(.😎 contrast(1.1) blur(1px);}
.bgshade{position:fixed;inset:0;z-index:-2;background: radial-gradient(ellipse at center,rgba(0,0,0,.2) 0%, rgba(0,0,0,.7) 100%);}
#gate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:rgba(4,4,4,.85);backdrop-filter:blur(10px);}
.gatebox{text-align:center;animation:fadeIn 1s ease;display:flex;flex-direction:column;align-items:center;gap:30px;}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.gate-pic{width:300px;height:300px;overflow:hidden;border-radius:0;border:none;}
.gate-pic img{width:100%;height:100%;object-fit:cover;}
#gobtn{padding:16px 40px;color:#fff;border:2px solid #d4af37;border-radius:12px;background:rgba(212,175,55,.1);font-size:.8rem;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.3s;}
#gobtn:hover{background:#d4af37;color:#000;transform:scale(1.05);}
.wrap{width:100%;display:flex;flex-direction:column;align-items:center;padding:40px 20px;opacity:0;pointer-events:none;transition:opacity.5s ease;}
.wrap.show{opacity:1;pointer-events:auto;}
.tag{color:var(--dim);font-size:.68rem;letter-spacing:1.5px;text-align:center;}
.rule{width:60px;height:2px;margin:30px 0;background:var(--gold);}
#treeArea{width:min(1100px,calc(100% - 28px))}
.tier{display:flex;flex-direction:column;align-items:center;margin:60px 0;}
.ttitle{color:#fff;font-size:.68rem;letter-spacing:5px;margin-bottom:20px;}
.roster{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;}
.person{width:180px;min-height:240px;padding:15px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(5,5,7,.72);backdrop-filter:blur(10px);transition:.3s;}
.person:hover{border-color:var(--gold);transform:translateY(-8px);}

/* PINALAKI NA BORDER NI SPINBACK */
.pface{width:140px;height:140px;margin:0 auto;border-radius:50%;overflow:hidden;border:3px solid rgba(212,175,55,.3);}
.pface img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

.pplacard{margin-top:10px;padding:10px;border:1px solid rgba(220,210,255,.14);border-radius:9px;background:rgba(255,255,255,.07);text-align:center;}
.pname{font-size:.8rem;font-weight:700;}
.phandle{font-size:.6rem;color:var(--dim);}
.pstatus{color:var(--gold);font-size:.6rem;margin-top:4px;}
.aboutme{width:min(500px,calc(100% - 40px));padding:20px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(5,5,7,.72);backdrop-filter:blur(10px);text-align:center;transition:.3s;}
.aboutme:hover{border-color:var(--gold);transform:translateY(-5px);}
.aboutme-title{font-size:.75rem;letter-spacing:3px;color:var(--gold);margin-bottom:12px;font-weight:700;}
.aboutme-text{font-size:.7rem;color:var(--dim);line-height:1.6;}
.player-new{width:min(650px,calc(100% - 40px));margin:60px auto;padding:18px;border-radius:16px;border:1px solid rgba(255,255,255,.13);background:rgba(10,10,12,.85);backdrop-filter:blur(20px);display:flex;gap:15px;align-items:center;}
.player-cover{width:60px;height:60px;border-radius:8px;overflow:hidden;}
.player-cover img{width:100%;height:100%;object-fit:cover;}
.player-main{flex:1;}
.player-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.player-info .player-title{font-size:.85rem;font-weight:700;}
.player-info .player-artist{font-size:.65rem;color:var(--dim);}
.player-controls{display:flex;align-items:center;gap:12px;}
.player-btn{background:transparent;border:none;color:var(--ink);font-size:1.2rem;cursor:pointer;transition:.2s;}
.player-btn:hover{color:var(--gold);}
.play-pause{font-size:1.6rem;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#000;display:grid;place-items:center;}
.play-pause:hover{transform:scale(1.1);}
.progress-wrap{width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:2px;cursor:pointer;margin:10px 0;}
.progress-bar{height:100%;width:0%;background:var(--gold);border-radius:2px;transition:width 0.1s linear;}
.vol-wrap{display:flex;align-items:center;gap:8px;}
.vol-slider{width:80px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;cursor:pointer;}
.stats-widget{position:fixed;right:30px;bottom:30px;z-index:80;padding:12px 20px;border-radius:50px;border:1px solid rgba(255,255,255,.13);background:rgba(10,10,12,.85);backdrop-filter:blur(20px);display:flex;align-items:center;gap:15px;}
.stat-item{display:flex;align-items:center;gap:8px;font-size:.8rem;}
.stat-icon{font-size:1.2rem;}
.stat-count{font-weight:700;}
.divider{width:1px;height:20px;background:rgba(255,255,255,.2);}
.heart-btn{cursor:pointer;transition:.2s;}
.heart-btn.liked{color:#ff0040;}
.heart-btn:hover{transform:scale(1.2);}
.navdots{position:fixed;right:30px;top:50%;transform:translateY(-50%);z-index:90;display:flex;flex-direction:column;gap:16px;}
.navdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s;}
.navdot.active{background:var(--gold);transform:scale(1.3);}
</style>
</head>
<body>

<img class="bgvideo" src="https://i.pinimg.com/originals/10/40/61/1040613057655618007.gif" alt="background">
<div class="bgshade"></div>

<div class="navdots">
<div class="navdot active" data-target="exclusive"></div>
<div class="navdot" data-target="about"></div>
<div class="navdot" data-target="player"></div>
</div>

<div class="stats-widget">
<div class="stat-item">
<span class="stat-icon">👁</span>
<span class="stat-count" id="viewCount">38</span>
</div>
<div class="divider"></div>
<div class="stat-item">
<span class="stat-icon heart-btn" id="likeBtn">♡</span>
<span class="stat-count" id="likeCount">14</span>
</div>
</div>

<div id="gate">
<div class="gatebox">
<div class="gate-pic">
<img src="https://i.imgur.com/I4ah3By.jpeg" alt="profile">
</div>
<button id="gobtn">die w me.</button>
</div>
</div>

<main class="wrap">
<p class="tag">“exclusive.”</p>
<div class="rule"></div>
<section id="treeArea">
<div class="tier" id="exclusive">
<div class="ttitle">EXCLUSIVE</div>
<div class="roster">
<article class="person">
<div class="pface"><img src="https://i.imgur.com/M1ftfV8.jpeg"></div>
<div class="pplacard"><div class="pname">SPINBACK/WAY2IC</div><div class="phandle">@icey.666</div><div class="pstatus">Online</div></div>
</article>
</div>
</div>
<div class="tier" id="about">
<div class="ttitle">ABOUT ME</div>
<div class="aboutme">
<div class="aboutme-title">above all gods</div>
<div class="aboutme-text">
huling cheat ko sa gta pa<br>
"exclusive"<br>
revshit
</div>
</div>
</div>
</section>
<div class="player-new" id="player">
<div class="player-cover"><img src="https://i.imgur.com/1I3xiWj.jpeg"></div>
<div class="player-main">
<div class="player-top">
<div class="player-info">
<div class="player-title">DIE FOR ME</div>
<div class="player-artist">CHASE ATLANTIC</div>
</div>
</div>
<div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="player-controls">
<button class="player-btn">🔀</button>
<button class="player-btn" id="stopBtn">⏹</button>
<button class="player-btn play-pause" id="playBtn">⏸</button>
<button class="player-btn">⏭</button>
<div class="vol-wrap">
<span>🔊</span>
<input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.01" value="0.6">
</div>
</div>
</div>
</div>
</main>

<script>
var audio = new Audio();
audio.src = "./Chase Atlantic - DIE FOR ME (Official Lyric Video) (2).mp3";
audio.volume = 0.6;
audio.loop = true;
var isPlaying = true;

// VIEWS + LIKES
var views = localStorage.getItem('siteViews') || 0;
views++;
localStorage.setItem('siteViews', views);
document.getElementById('viewCount').innerText = views;
var likes = localStorage.getItem('siteLikes') || 0;
var liked = localStorage.getItem('liked') === 'true';
document.getElementById('likeCount').innerText = likes;
if(liked){document.getElementById('likeBtn').innerHTML='♥';document.getElementById('likeBtn').classList.add('liked');}
document.getElementById('likeBtn').addEventListener('click',function(){
if(!liked){likes++; liked=true; this.innerHTML='♥'; this.classList.add('liked');}
else{likes--; liked=false; this.innerHTML='♡'; this.classList.remove('liked');}
localStorage.setItem('siteLikes', likes);
localStorage.setItem('liked', liked);
document.getElementById('likeCount').innerText = likes;
});

document.getElementById("gobtn").addEventListener("click",function(){
document.getElementById("gate").style.display="none";
document.querySelector(".wrap").classList.add("show");
audio.play().catch(()=>{});
document.getElementById("playBtn").addEventListener("click",function(){
if(isPlaying){ audio.pause(); this.innerHTML = "▶"; isPlaying = false;}
else{ audio.play().catch(()=>{}); this.innerHTML = "⏸"; isPlaying = true;}
});
document.getElementById("stopBtn").addEventListener("click",function(){
audio.pause(); audio.currentTime = 0; document.getElementById("playBtn").innerHTML = "▶"; isPlaying = false;
});
document.getElementById("volSlider").addEventListener("input",function(){
audio.volume = this.value;
});
audio.addEventListener('timeupdate',()=>{
var progress = (audio.currentTime / audio.duration) * 100;
document.getElementById("progressBar").style.width = progress + '%';
});
document.getElementById("progressWrap").addEventListener('click',(e)=>{
var width = e.currentTarget.clientWidth;
var clickX = e.offsetX;
var duration = audio.duration;
audio.currentTime = (clickX / width) * duration;
});
// NAV DOTS
document.querySelectorAll('.navdot').forEach(dot=>{
dot.addEventListener('click',()=>{
document.getElementById(dot.dataset.target).scrollIntoView({behavior:'smooth'});
});
});
</script>
</body>
</html>
